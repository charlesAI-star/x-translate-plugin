<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X timeline fixture</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #0f1419;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 620px; margin: 0 auto; }
    article[data-testid="tweet"] {
      padding: 16px;
      border: 1px solid #cfd9de;
      border-radius: 14px;
      margin: 0 0 16px;
    }
    [data-testid="tweetText"] { white-space: pre-wrap; }
    blockquote {
      margin: 12px 0 0;
      padding: 10px 12px;
      border: 1px solid #cfd9de;
      border-radius: 12px;
    }
    .quoted { margin-top: 8px; }
    button { font: inherit; }
  </style>
</head>
<body>
  <main id="timeline">
    <article data-testid="tweet" id="tweet-en">
      <div data-testid="tweetText" lang="en">This is a test tweet about AI.</div>
    </article>

    <article data-testid="tweet" id="tweet-zh">
      <div data-testid="tweetText" lang="zh">这是一条中文推文，不需要翻译。</div>
    </article>

    <article data-testid="tweet" id="tweet-ja">
      <div data-testid="tweetText" lang="ja">これは日本語のツイートです。</div>
    </article>

    <article data-testid="tweet" id="tweet-quote">
      <div data-testid="tweetText" lang="en">Look at this quote:</div>
      <div class="quoted" role="link">
        <div data-testid="tweetText" lang="en">This is the quoted tweet.</div>
      </div>
    </article>
  </main>
</body>
</html>
